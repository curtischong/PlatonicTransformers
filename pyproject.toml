[project]
name = "platonic_transformers"
version = "0.0.1"
description = "Platonic Transformers: A Solid Choice For Equivariance"
authors = [
    { name = "Mohammad Mohaiminul Islam", email = "m.islam@uva.nl" }
]
readme = "README.md"
requires-python = ">=3.12.0,<3.13"
license = "MIT"
keywords = [
    'artificial intelligence',
    'deep learning',
    '3D molecules',
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.12',
]

dependencies = [
    # --------- Core ML & DS Stack --------- #
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    # CVE-2026-44484: avoid compromised Lightning releases 2.6.2 and 2.6.3.
    "lightning==2.6.4",
    "pytorch-lightning==2.6.4",
    "torchmetrics",
    "torch-geometric",
    "torch-scatter==2.1.2",
    "torch-cluster==1.6.3",
    "torch-sparse==0.6.18",
    "torch-spline-conv==1.2.2",
    "timm",

    # --------- Project Specific --------- #
    "fairchem-core",
    "ase-db-backends",
    "mendeleev",
    "scikit-learn",
    "rdkit",
    "h5py",

    # --------- Utilities --------- #
    "wandb",
    "ipdb",
    "ml-collections",
    "pyyaml",
]

[project.urls]
Homepage = "https://pypi.org/project/platonic_transformers/"
Repository = "https://github.com/niazoys/PlatonicTransformers"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["platonic_transformers"]

[project.optional-dependencies]
imagenet = [
    "nvidia-dali-cuda120; sys_platform == 'linux'",
]
qm9-generation = [
    "posebusters",
]
dev = [
    "basedpyright",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-timeout",
    "pytest-rerunfailures",
]

[tool.uv]
override-dependencies = [
    # Keep PyTorch-family binary wheels on the same CUDA/Torch ABI.
    "torch==2.8.0+cu128; sys_platform == 'linux'",
    "torchaudio==2.8.0+cu128; sys_platform == 'linux'",
    "torchvision==0.23.0+cu128; sys_platform == 'linux'",
    "torch-scatter==2.1.2+pt28cu128; sys_platform == 'linux'",
    "torch-cluster==1.6.3+pt28cu128; sys_platform == 'linux'",
    "torch-sparse==0.6.18+pt28cu128; sys_platform == 'linux'",
    "torch-spline-conv==1.2.2+pt28cu128; sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torch-scatter = [
    { index = "pyg-cpu", marker = "sys_platform != 'linux'" },
    { index = "pyg-cu128", marker = "sys_platform == 'linux'" },
]
torch-cluster = [
    { index = "pyg-cpu", marker = "sys_platform != 'linux'" },
    { index = "pyg-cu128", marker = "sys_platform == 'linux'" },
]
torch-sparse = [
    { index = "pyg-cpu", marker = "sys_platform != 'linux'" },
    { index = "pyg-cu128", marker = "sys_platform == 'linux'" },
]
torch-spline-conv = [
    { index = "pyg-cpu", marker = "sys_platform != 'linux'" },
    { index = "pyg-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.8.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu128"
url = "https://data.pyg.org/whl/torch-2.8.0+cu128.html"
format = "flat"
explicit = true

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
torch-cluster = ["torch"]
torch-sparse = ["torch"]
torch-spline-conv = ["torch"]

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

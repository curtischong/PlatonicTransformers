datamodule:
  _target_: src.data.omol_4m_module.OMol4mModule
  validation_mode: train_split  # train_split: val from train, heldout path used as test | heldout: val from val_data_path
  precompute_reference_energy: true
  reference_path: configs/constants/element_refs.yaml

  data:
    train_data_path: ${oc.env:DATA_PATH}/open_mol/train_4M/
    val_data_path: ${oc.env:DATA_PATH}/open_mol/val/
    pin_memory: True
    num_workers: 8  # Start with 2, increase after confirming it works
    seed: 42
    train_size: 0.9
    shuffle: True

  batch_size:
    train: 32    # Reduced from 32 to fit in memory
    val: 32     # Reduced from 64

  # Optional: enable dynamic batching
  dynamic_batching: true
  max_atoms_per_batch: 1000   # Reduced from 10000 to fit in memory
  max_atoms_per_batch_val: 1000
  debug_subset: null          # Supports fraction (e.g., 0.25) or count (e.g., 10000)

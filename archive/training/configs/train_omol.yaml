defaults:
  - force_field_module: mc_egnn
  - data: omol
  - trainer: default

checkpoint_path:
exp_name: uma
seed: 1
model_name: transformer

# Precision / backend knobs. Defaults match Lightning + PyTorch defaults
# (slow but reproducible). Override via `+precision=bf16_h100` (config group)
# or individually, e.g. `matmul_precision=high cudnn_benchmark=true`.
#   trainer.precision is Lightning's: 32-true | bf16-mixed | bf16-true | 16-mixed
#   matmul_precision feeds torch.set_float32_matmul_precision: highest | high | medium
matmul_precision: highest
cudnn_benchmark: false
cudnn_deterministic: true

wandb:
  use_wandb: False
  entity: omol-leaderboard
  wandb_project: leaderboard
  group: neutral-set-34M

comet:
  use_comet: False
  group: debug

optimizer:
  lr: 5e-4
  lr_min: 1e-6
  name: free 
  weight_decay: 0.0
  e_loss_name: per_atom_mae
  f_loss_name: l2norm
  e_weight: 10
  f_weight: 10
  amsgrad: False
  scheduler_name: cosine_annealing
  T_max: 1
  num_warmup_steps: 100
  num_restarts: 10

train_augmentation: False
compile: False
reference_path: configs/constants/element_refs.yaml

train_mean: 3.253
train_rmsd: 6.383
flops_coef: 6

datamodule:
  _target_: src.data.omol_4m_module.OMol4mModule
  validation_mode: heldout
  precompute_reference_energy: true
  reference_path: configs/constants/element_refs.yaml

  data:
    train_data_path: ${oc.env:DATA_PATH}/open_mol/train/
    val_data_path: ${oc.env:DATA_PATH}/open_mol/val/
    pin_memory: True
    num_workers: 8
    seed: 42
    train_size: 0.9
    shuffle: True

  batch_size:
    train: 64
    val: 64

  dynamic_batching: true
  max_atoms_per_batch: 6000
  max_atoms_per_batch_val: 6000
  debug_subset: null
